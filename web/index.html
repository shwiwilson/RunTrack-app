<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Private training, real progress and your running community. Connect your running data and stay close to your club with RunTrack.">
  <meta name="theme-color" content="#315A18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RunTrack">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>RunTrack · Your running. Your club.</title>
  <style>
    body{margin:0;background:#f5f7f2}
    #opening{font:500 16px/1.5 system-ui;color:#315a18;min-height:100vh;display:grid;place-items:center}
  </style>
</head>
<body>
  <div id="opening" role="status">Opening RunTrack…</div>
  <noscript>RunTrack needs JavaScript to securely open your account.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('opening')?.remove());
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

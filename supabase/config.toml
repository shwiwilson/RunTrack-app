# Local isolated RunTrack development stack. Hosted settings must also be configured explicitly.
project_id = "runtrack-clean"
[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = false
[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 56324
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/", "http://127.0.0.1:3000/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8183
deno_version = 2
[analytics]
enabled = false

[functions.delete-account]
verify_jwt = false
[functions.export-data]
verify_jwt = false
[functions.health-connect]
verify_jwt = false
[functions.health-sync]
verify_jwt = false
[functions.health-disconnect]
verify_jwt = false
[functions.health-callback]
verify_jwt = false
[functions.health-webhook]
verify_jwt = false
